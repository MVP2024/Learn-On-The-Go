name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  lint_and_test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (black)
        run: black --check .
      - name: Lint (isort)
        run: isort --check-only .
      - name: Lint (flake8)
        run: flake8 .
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          pytest -q -o addopts=''

  docker_build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web image
        run: docker build -f docker/Dockerfile -t learningplatform-web:ci .
      - name: Build nginx image
        run: docker build -f docker/nginx/Dockerfile -t learningplatform-nginx:ci .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [lint_and_test, docker_build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: ${{ secrets.REPO_URL }}
          FALLBACK_REPO_URL: git@github.com:${{ github.repository }}.git
          BRANCH: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          envs: REPO_URL,FALLBACK_REPO_URL,BRANCH,DEPLOY_PATH
          script: |
            set -e
            APP_DIR="${DEPLOY_PATH:-/opt/learningplatform}"
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$(whoami)" "$APP_DIR"
            fi
            REPO_CLONE_URL="${REPO_URL:-$FALLBACK_REPO_URL}"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$REPO_CLONE_URL" || true
              git fetch --all --prune
              git reset --hard "origin/${BRANCH:-main}"
            else
              git clone "$REPO_CLONE_URL" "$APP_DIR"
              cd "$APP_DIR"
              git checkout "${BRANCH:-main}" || true
            fi
            if [ ! -f .env ]; then
              echo "ERROR: .env not found at $APP_DIR/.env. Place your production env file before deploying." >&2
              exit 1
            fi
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
            docker compose exec -T web python manage.py migrate --noinput || true
            docker compose exec -T web python manage.py collectstatic --noinput || true
            docker compose ps
