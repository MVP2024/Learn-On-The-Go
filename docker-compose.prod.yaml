# Настройки для Docker Compose
# - Использует готовые образы и gunicorn
# - Нет привязки к коду.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SKIP_REQUIREMENTS=1
    entrypoint: ["/bin/bash", "/code/docker/entrypoint.sh"]
    command: ["gunicorn"]
    volumes:
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - static_volume:/code/staticfiles:ro
      - media_volume:/code/media:ro
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
