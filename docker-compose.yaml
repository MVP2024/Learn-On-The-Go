version: '3.8'

# Docker Compose для локальной разработки LearningPlatform
# - использует переменные из файла .env в корне проекта
# - предназначен для dev: зависимости устанавливаются при старте контейнера (удобно для разработки)
# - для продакшена рекомендуем собрать отдельный образ с gunicorn/nginx и не устанавливать зависимости на старте

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      # Postgres берет значения из .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_DATABASE=${REDIS_DB:-1}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    # Для dev мы используем официальный Python образ и устанавливаем зависимости при старте.
    image: python:3.11-slim
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/bash", "-lc", "pip install --no-cache-dir -r requirements.txt && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    environment:
      # Дополнительные переменные окружения полезные для Django
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  celery:
    image: python:3.11-slim
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
    depends_on:
      - redis
      - db
    command: ["/bin/bash", "-lc", "pip install --no-cache-dir -r requirements.txt && celery -A config worker --loglevel=info --concurrency=2"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  celery-beat:
    image: python:3.11-slim
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
    depends_on:
      - redis
      - db
    command: ["/bin/bash", "-lc", "pip install --no-cache-dir -r requirements.txt && celery -A config beat --loglevel=info"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  # Опционально: Flower для мониторинга Celery
  flower:
    image: python:3.11-slim
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
    depends_on:
      - redis
      - db
    command: ["/bin/bash", "-lc", "pip install --no-cache-dir -r requirements.txt && celery -A config flower --port=5555"]
    ports:
      - "5555:5555"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  default:
    name: learningplatform_default
