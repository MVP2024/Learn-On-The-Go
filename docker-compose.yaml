# Docker Compose для локальной разработки LearningPlatform
# - использует переменные из файла .env в корне проекта
# - предназначен для dev: зависимости устанавливаются в образе (чтобы команды внутри контейнера работали одинаково)
# - для продакшена рекомендуем собрать отдельный образ с gunicorn/nginx и не устанавливать зависимости на старте

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      # Postgres берет значения из .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_DATABASE=${REDIS_DB:-1}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    # Строим образ на основе docker/Dockerfile (в него уже попадают зависимости из requirements.txt)
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
      - ./docker/entrypoint.sh:/code/docker/entrypoint.sh:ro
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    entrypoint: ["/bin/bash", "/code/docker/entrypoint.sh"]
    command: ["web"]
    environment:
      # Дополнительные переменные окружения полезные для Django
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
      - ./docker/entrypoint.sh:/code/docker/entrypoint.sh:ro
    depends_on:
      - redis
      - db
    entrypoint: ["/bin/bash", "/code/docker/entrypoint.sh"]
    command: ["celery"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
      - ./docker/entrypoint.sh:/code/docker/entrypoint.sh:ro
    depends_on:
      - redis
      - db
    entrypoint: ["/bin/bash", "/code/docker/entrypoint.sh"]
    command: ["celery-beat"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    restart: unless-stopped

  # Опционально: Flower для мониторинга Celery
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    working_dir: /code
    volumes:
      - ./:/code:cached
      - ./docker/entrypoint.sh:/code/docker/entrypoint.sh:ro
    depends_on:
      - redis
      - db
    entrypoint: ["/bin/bash", "/code/docker/entrypoint.sh"]
    command: ["flower"]
    ports:
      - "5555:5555"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  default:
    name: learningplatform_default
